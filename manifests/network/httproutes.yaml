# HTTPRoutes to expose each baseline agent via the cluster gateway.
# Replace <gateway-name>, <gateway-namespace>, and <cluster-domain> for your environment.
# On EKS with Envoy AI Gateway, the parentRef will point to your Envoy Gateway instance.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: baseline-go-minimal
  namespace: kagent
spec:
  parentRefs:
  - name: <gateway-name>
    namespace: <gateway-namespace>
  hostnames:
  - "baseline-go-minimal.<cluster-domain>"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: baseline-go-minimal
      port: 8080
---
