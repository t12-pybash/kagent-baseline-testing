apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-kagent
  namespace: ai-platform
spec:
  podSelector:
    matchLabels:
      app: litellm
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kagent
    ports:
    - protocol: TCP
      port: 4000
