apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: baseline-go-k8s-tools
  namespace: kagent
  labels:
    baseline.test/type: "03-go-k8s-tools"
spec:
  type: Declarative
  description: Baseline agent - Go runtime, Kubernetes tools
  declarative:
    runtime: go
    modelConfig: default-model-config
    tools:
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: kagent-tool-server
        toolNames:
        - k8s_get_resources
        - k8s_get_pod_logs
        - k8s_describe_resource
    systemMessage: |
      You are a Kubernetes operations assistant. Use the available tools to answer questions about the cluster. Be concise.
