apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: baseline-go-multiturn
  namespace: kagent
  labels:
    baseline.test/type: "06-go-multiturn"
spec:
  type: Declarative
  description: Baseline agent - Go runtime, no tools, stateful multi-turn conversation
  declarative:
    runtime: go
    modelConfig: default-model-config
    systemMessage: |
      You are a stateful infrastructure planning assistant. You remember previous messages in the conversation and build on them. Keep responses to two sentences maximum.
